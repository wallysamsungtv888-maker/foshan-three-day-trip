<svg xmlns='http://www.w3.org/2000/svg' class="map" id="art-map" viewBox="0 0 400 800" role="img" aria-label="路線示意：香港在南，西樵在西，禪城在東。圖示相對方位，並非精確道路或距離。"><style>
      .lbl{font-family:"Noto Sans CJK HK","Noto Sans CJK TC",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;fill:#2A1C14}
      .steam{animation:steam 3.8s ease-in-out infinite}
      .twinkle{animation:shim 2.6s ease-in-out infinite}
      @keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
      @keyframes shim{0%,100%{opacity:.28}50%{opacity:.9}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>

  <defs>
    <filter id="m-sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="1.2" dy="2" stdDeviation="1.8" flood-color="#2A1C14" flood-opacity=".28"/>
    </filter>
    <filter id="m-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="m-tile" width="8" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q4 0 8 5" fill="none" stroke="#0B3A32" stroke-width=".55" opacity=".55"/>
    </pattern>
    <pattern id="m-tilehi" width="8" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q4 0 8 5" fill="none" stroke="#4EBfa0" stroke-width=".4" opacity=".28"/>
    </pattern>
    <pattern id="m-brick" width="14" height="8" patternUnits="userSpaceOnUse">
      <rect width="14" height="8" fill="#C45A42"/>
      <path d="M0 8h14M0 4h14M7 0v4M0 4v4M14 4v4" fill="none" stroke="#6A2A22" stroke-width=".45" opacity=".7"/>
    </pattern>
    <pattern id="m-gbrick" width="12" height="7" patternUnits="userSpaceOnUse">
      <rect width="12" height="7" fill="#8A8E86"/>
      <path d="M0 7h12M0 3.5h12M6 0v3.5M0 3.5v3.5" fill="none" stroke="#5A5E56" stroke-width=".4" opacity=".75"/>
    </pattern>
    <pattern id="m-rbrick" width="12" height="7" patternUnits="userSpaceOnUse">
      <rect width="12" height="7" fill="#B5523E"/>
      <path d="M0 7h12M0 3.5h12M6 0v3.5M0 3.5v3.5" fill="none" stroke="#6A2A22" stroke-width=".4" opacity=".75"/>
    </pattern>
    <pattern id="m-stone" width="22" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12h22M11 0v12M0 6h22" fill="none" stroke="#8A7348" stroke-width=".45" opacity=".4"/>
    </pattern>
    <pattern id="m-leaf" width="16" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#1E4A2E" opacity=".35"/>
      <circle cx="11" cy="8" r="1.3" fill="#2A5A38" opacity=".3"/>
      <circle cx="13" cy="3" r="1.1" fill="#163820" opacity=".28"/>
    </pattern>
    <linearGradient id="m-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AAF90"/><stop offset=".4" stop-color="#1F6B5A"/><stop offset="1" stop-color="#123F38"/>
    </linearGradient>
    <linearGradient id="m-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DEA0"/><stop offset="1" stop-color="#D4A24A"/>
    </linearGradient>
    <linearGradient id="m-col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A1A14"/><stop offset=".45" stop-color="#C4452D"/><stop offset="1" stop-color="#5A1210"/>
    </linearGradient>
  </defs>

  <linearGradient id="m-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A9D0CE"/><stop offset="1" stop-color="#7EB0B0"/>
  </linearGradient>
  <linearGradient id="m-land" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3E1C4"/><stop offset="1" stop-color="#E2C898"/>
  </linearGradient>
  <pattern id="m-hill" width="28" height="18" patternUnits="userSpaceOnUse">
    <path d="M0 18 L8 8 L16 18 M14 18 L22 10 L30 18" fill="none" stroke="#7FA88A" stroke-width="1" opacity=".45"/>
  </pattern>
  <pattern id="m-urban" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect x="2" y="3" width="5" height="8" fill="#C9A078" opacity=".28"/>
    <rect x="9" y="5" width="5" height="7" fill="#A88A60" opacity=".22"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#C4452D"/>
  </marker>
  <rect width="400" height="800" fill="url(#m-water)"/>
  <!-- water ripples, unnamed 水道示意 -->
  <g fill="none" stroke="#8FB8B4" stroke-width="1.3" opacity=".55">
    <path d="M16 240q36 10 72 0t72 0"/><path d="M200 430q36 10 72 0t72 0"/>
    <path d="M20 610q50 12 100 0t100 0"/>
