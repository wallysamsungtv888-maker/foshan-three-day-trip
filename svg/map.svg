  <path d="M40 734 C100 720 180 724 220 728 S320 720 362 734" fill="#D7EBE3" opacity=".8"/>
  <text class="lbl" x="200" y="784" font-size="15" font-family="Noto Sans CJK HK, Noto Sans CJK TC, PingFang HK, sans-serif" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.6" stroke-linejoin="round" fill="#2A1C14">香港（示意）</text>

