  <text x="200" y="236" text-anchor="middle" font-size="11" font-family="Noto Sans CJK HK, Noto Sans CJK TC, PingFang HK, sans-serif" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.6" stroke-linejoin="round" fill="#2A1C14">水道（示意）</text>
  <text x="300" y="620" text-anchor="middle" font-size="11" font-family="Noto Sans CJK HK, Noto Sans CJK TC, PingFang HK, sans-serif" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.6" stroke-linejoin="round" fill="#2A1C14">水域（示意）</text>

  <!-- Xiqiao west, hilly -->
  <path d="M28 40 C90 14 210 16 286 52 C336 82 344 164 286 206 C214 248 46 234 26 152 C16 100 14 60 28 40z" fill="url(#m-land)" stroke="#8A6A40" stroke-width="2"/>
