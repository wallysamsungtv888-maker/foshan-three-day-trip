  <g transform="translate(80 300)">
    <path d="M10 28 C30 10 70 8 90 24 L80 36 H16z" fill="#8A6A40" stroke="#E2B13C" stroke-width=".8"/>
    <path d="M44 8 v18" stroke="#C9A25A" stroke-width="2"/>
    <path d="M44 10 l18 8H44z" fill="#C4452D"/>
  </g>
  <g transform="translate(200 392) scale(1.05)">
